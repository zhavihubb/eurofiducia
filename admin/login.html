<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal — EuroFiducia</title>
<link rel="stylesheet" href="../assets/css/style.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-side">
    <div class="auth-side-content">
      <div style="display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:800;color:#fff;margin-bottom:40px;">
        <span style="width:38px;height:38px;border-radius:10px;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;">€</span> EuroFiducia
      </div>
      <h2>Admin Portal</h2>
      <p>Secure administrative access to manage users, transactions, compliance, and platform operations.</p>
      
    </div>
  </div>
  <div class="auth-main">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:32px;">
        <div style="width:64px;height:64px;border-radius:16px;background:var(--grad-navy);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 16px;">🔐</div>
        <h2>Admin Sign In</h2>
        <p class="subtitle">Administrative access only</p>
      </div>
      <form onsubmit="return doAdminLogin(event)">
        <div class="form-group">
          <label class="form-label">Admin Email</label>
          <input type="email" class="form-input" id="email" required placeholder="Email address" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="password" required placeholder="Password" autocomplete="current-password">
        </div>
        <div id="loginError" class="form-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In to Admin Panel</button>
      </form>
      <div class="divider"></div>
      <p class="text-center text-muted text-sm"><a href="../login.html">← User Login</a></p>
    </div>
  </div>
</div>
<script src="../assets/js/translations.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/sync.js"></script>
<script>
  // Cross-device persistence — point at your deployed backend (see server/README.md).
  // Leave empty string for local-only (localStorage) during dev.
  if (window.EV && EV.sync) EV.sync.init(localStorage.getItem("ev_backend_url") || "");
</script>
<script>
// If already logged in as admin, redirect
if (EV.auth.isAdmin()) window.location.href = 'dashboard.html';
function doAdminLogin(e) {
  e.preventDefault();
  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;
  var result = EV.auth.login(email, password);
  var err = document.getElementById('loginError');
  if (!result.ok) { err.textContent = result.msg; err.classList.remove('hidden'); return false; }
  if (result.role !== 'admin') {
    err.textContent = 'This is a user account. Use the user login page.'; err.classList.remove('hidden');
    EV.auth.logout(); return false;
  }
  err.classList.add('hidden');
  window.location.href = 'dashboard.html';
  return false;
}
</script>
</body>
</html>
